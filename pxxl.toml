version = 1

[build]
language = "python"
framework = "fastapi"
packageManager = "pip"
runtime = "3.12"
baseDirectory = "/"
port = 8000
installCommand = "pip install -r requirements.txt"
buildCommand = ""
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers"

[env]
PYTHONUNBUFFERED = "1"
